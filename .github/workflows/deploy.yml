name: Deploy ai-demo portal in docker using GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Docker_hub_login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v2
        with:
          context: /home/runner/work/AI-demo/arcis_frontend_r-d
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/arcis_frontend_r-d:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v2
        with:
          context: /home/runner/work/AI-demo/arcis_backend_r-d
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/arcis_backend_r-d:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |

            docker pull ${{ secrets.DOCKER_USERNAME }}/arcis_frontend_r-d:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/arcis_backend_r-d:latest
            docker compose -f /home/ubuntu/AI-demo/docker-compose.yml up -d